name: Fetch Nintendo Switch Games

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run scraper
        run: |
          python scrape_switch_games.py > Switch.Games.json
      - name: Upload output
        uses: actions/upload-artifact@v2
        with:
          name: Switch Games Output
          path: Switch.Games.json
