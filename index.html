<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Database</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Platform Selection View -->
        <div id="platformView" class="view active">
            <h1>Games Database</h1>
            <p class="subtitle">Select a platform to view games</p>
            <div id="platformButtons" class="platform-buttons">
                <p class="loading">Loading platforms...</p>
            </div>
        </div>

        <!-- Games List View -->
        <div id="gamesView" class="view">
            <button id="homeButton" class="home-button">← Home</button>
            <h1 id="platformTitle"></h1>
            
            <div class="search-container">
                <input type="text" id="searchBar" placeholder="Search by title or Title ID..." />
            </div>

            <div id="gamesCount" class="games-count"></div>
            <div id="gamesList" class="games-list">
                <p class="loading">Loading games...</p>
            </div>
        </div>

        <!-- Game Info View -->
        <div id="gameInfoView" class="view">
            <button id="backButton" class="home-button">← Back to Games</button>
            <button id="homeButtonInfo" class="home-button">← Home</button>
            
            <div class="game-info-container">
                <h1 id="gameInfoTitle" class="game-info-title"></h1>
                
                <div class="game-info-details">
                    <div class="game-info-section" id="titleIdSection">
                        <h3>Title ID</h3>
                        <p id="gameInfoTitleId"></p>
                    </div>
                    
                    <div class="game-info-section" id="regionSection">
                        <h3>Region</h3>
                        <p id="gameInfoRegion"></p>
                    </div>
                    
                    <div class="game-info-section" id="releaseDateSection">
                        <h3>Release Date / OS Version</h3>
                        <p id="gameInfoReleaseDate"></p>
                    </div>
                    
                    <div class="game-info-section" id="distributionMethodSection">
                        <h3>Distribution Method</h3>
                        <p id="gameInfoDistribution"></p>
                    </div>
                    
                    <div class="game-info-section" id="versionsSection">
                        <h3>Versions</h3>
                        <p id="gameInfoVersions"></p>
                    </div>
                    
                    <div class="game-info-section" id="cartridgeDescriptionSection">
                        <h3>Cartridge Description</h3>
                        <p id="gameInfoCartridge"></p>
                    </div>
                    
                    <div class="game-info-section" id="typeSection">
                        <h3>Type</h3>
                        <p id="gameInfoType"></p>
                    </div>
                    
                    <div class="game-info-section" id="alternateNamesSection">
                        <h3>Alternate Names</h3>
                        <ul id="gameInfoAlternateNames"></ul>
                    </div>
                    
                    <div class="game-info-section" id="descriptionSection">
                        <h3>Description</h3>
                        <p id="gameInfoDescription"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
